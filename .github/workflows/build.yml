name: Build levipack
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        run: |
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby.git third_party/Dobby
      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Package
        run: |
          mkdir pkg
          cp build/libBedrockClient.so manifest.json icon.png pkg/
          cd pkg && zip -r ../BedrockClient.levipack .
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockClient
          path: BedrockClient.levipack
